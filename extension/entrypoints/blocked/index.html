<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Blocked</title>
<link rel="stylesheet" href="../../css/main.css" />
<script src="/theme.js"></script>
</head>
<body>

<main class="flex min-h-screen items-center justify-center px-5 py-12">
  <div class="card w-full max-w-md px-7 py-8 animate-rise sm:px-9 sm:py-10">

    <img src="/icons/mark.svg" alt="" width="44" height="44" class="size-11 rounded-xl" />

    <h1 class="mt-6 text-xl font-semibold tracking-[-0.02em]">This site is blocked</h1>
    <p id="host" class="mt-1.5 break-all text-[0.9375rem] font-medium text-accent empty:hidden"></p>

    <div class="mt-5 space-y-3 text-sm leading-relaxed text-muted">
      <p>torwache stopped this navigation because the site matches an entry on your list.</p>
      <p>This page has no bypass. To open the site, switch its entry off in your blocklist first.</p>
    </div>

    <button id="open" type="button" class="btn mt-7 w-full">Open blocklist</button>

    <p id="matched" class="mt-4 text-xs leading-relaxed text-faint empty:hidden"></p>

  </div>
</main>

<script type="module" src="./main.ts"></script>
</body>
</html>
